# Render Blueprint — deploys the FastAPI backend.
# Render dashboard → New → Blueprint → pick this repo. Secrets marked `sync: false`
# are entered in the dashboard, never committed.
services:
  - type: web
    name: takawise-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    # Migrations run on every deploy before the server starts (idempotent).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false # e.g. https://hisabify.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
